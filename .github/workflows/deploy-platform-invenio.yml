name: Deploy InvenioRDM POC to self-hosted server

# Deploys platform/ to the SAME scratch subdomain set up by hand in
# Migration Phase 2 (ovf-invenio.duckdns.org - see
# docs/adr/0005-adopt-inveniordm.md, docs/ROADMAP.md). This is not the
# production cutover - apps/platform keeps serving
# open-vis-framework.duckdns.org until Migration Phase 8, which will
# need its own, different deploy step (real secret, real domain, real
# Traefik cutover), not a repoint of this one.
#
# Mirrors deploy-platform.yml's SSH + Docker Compose pattern, reusing
# the same DEPLOY_SSH_KEY CI secret (same server, same purpose).

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/deploy-platform-invenio.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 89.58.55.170
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/open-vis-framework-src
            git fetch origin main
            git reset --hard origin/main
            cd platform
            docker compose --file docker-compose.full.yml \
              --file docker-compose.poc-override.yml \
              build web-ui
            docker compose --file docker-compose.full.yml \
              --file docker-compose.poc-override.yml \
              build web-api worker scheduler
            docker compose --file docker-compose.full.yml \
              --file docker-compose.poc-override.yml \
              up -d cache db mq search web-ui web-api worker scheduler
