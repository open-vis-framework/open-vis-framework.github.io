name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

  install-platform:
    # Sanity check only for now: does platform/'s uv.lock still resolve
    # cleanly? No lint/test step yet - platform/ has no tests written
    # (see docs/ROADMAP.md). Expand this job once that changes.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - run: uv sync --frozen
