name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-platform:
    # Resolve the locked Invenio environment, then run the instance's focused
    # service/config tests without requiring a separate pytest dependency.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - run: uv sync --frozen

      - run: uv run python -m unittest discover -s site/tests -v
