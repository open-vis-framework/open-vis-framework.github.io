name: Deploy platform to self-hosted server

on:
  push:
    branches: [main]
    paths:
      - "apps/platform/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/deploy-platform.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 89.58.55.170
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/open-vis-framework-src
            git fetch origin main
            git reset --hard origin/main
            # docker-compose.yml is the single source of truth (see
            # docs/adr/0003-dockerize-same-server.md) - no Node/pnpm on
            # the host needed for any of this, migrations included.
            docker compose --env-file apps/platform/.env build
            docker compose --env-file apps/platform/.env --profile tools run --rm migrate
            docker compose --env-file apps/platform/.env up -d
