name: Deploy platform to self-hosted server

# Deploys platform/ (InvenioRDM) to the production domain,
# open-vis-framework.duckdns.org - replaces the old Next.js apps/platform
# deploy workflow of the same name as of Migration Phase 8. See
# docs/adr/0005-adopt-inveniordm.md and docs/ROADMAP.md.
#
# Mirrors the previous deploy-platform.yml's SSH + Docker Compose
# pattern, reusing the same DEPLOY_SSH_KEY CI secret (same server, same
# purpose).
#
# Does NOT run one-time DB/index/role init (invenio db init create,
# invenio index init, invenio files location create, invenio roles
# create/access allow) - those were run once by hand over SSH during
# cutover, matching how Migration Phase 2's POC was set up. A fresh
# Postgres volume (new server, disaster recovery, etc.) needs that same
# manual step again - not automated here yet.
#
# Real finding (Migration Phase 10 redo, docs/ROADMAP.md): docker-compose.full.yml's
# `static_data` named volume is mounted over /opt/invenio/var/instance/static
# on both `web-ui` and `frontend`. Docker only auto-populates a named
# volume from image content the *first* time it's created empty - every
# `build` + `up -d` since then leaves the old volume content in place,
# shadowing whatever the fresh image now has baked into that path (a
# Dockerfile `COPY ./static/...` alone is not enough). Concretely: a
# new static image (logo, etc.) landed in the image, but never appeared
# live, because the pre-existing volume's old file listing just didn't
# include it. Fixed below by explicitly re-syncing the volume from the
# freshly-built image before `up -d`. Safe to do unconditionally -
# static_data only ever holds regenerable build output (webpack/collect
# results), never user data, unlike db_data/uploaded_data/search_data.

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/deploy-platform.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 89.58.55.170
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Without this, appleboy/ssh-action does not reliably fail the
          # GitHub Actions job just because the remote script's `set -e`
          # aborted partway through - a broken deploy step can silently
          # report green. Found the hard way: the static_data re-sync
          # step below (first version, without this flag and without
          # its own error check) very likely failed silently on its
          # first real deploy - the job showed success but the site's
          # static files didn't change.
          script_stop: true
          script: |
            set -e
            cd ~/open-vis-framework-src
            git fetch origin main
            git reset --hard origin/main
            cd platform
            docker compose --file docker-compose.full.yml \
              --file docker-compose.prod-override.yml \
              build web-ui
            docker compose --file docker-compose.full.yml \
              --file docker-compose.prod-override.yml \
              build web-api worker scheduler
            # Re-sync static_data from the freshly-built image: named
            # volumes aren't refreshed by `build`/`up` on their own once
            # they already exist (see comment above). Mounting the
            # volume at a path other than the image's own static/ dir
            # keeps the image's baked-in files visible inside this
            # container to copy from. Resolve the actual (project-
            # prefixed) volume name via Compose's own labels rather than
            # assuming a naming convention, and fail loudly (not with a
            # silently-broken `-v :/dst`) if that doesn't resolve to
            # exactly one volume.
            STATIC_VOLUME=$(docker volume ls \
              --filter label=com.docker.compose.project=platform \
              --filter label=com.docker.compose.volume=static_data \
              --format '{{.Name}}')
            echo "Resolved static_data volume: '${STATIC_VOLUME}'"
            if [ -z "${STATIC_VOLUME}" ] || [ "$(echo "${STATIC_VOLUME}" | wc -l)" -ne 1 ]; then
              echo "ERROR: expected exactly one static_data volume, got: '${STATIC_VOLUME}'" >&2
              exit 1
            fi
            docker run --rm \
              -v "${STATIC_VOLUME}:/dst" \
              open-vis-framework:latest \
              sh -c "cp -a /opt/invenio/var/instance/static/. /dst/ && echo 'static_data refreshed, now contains:' && ls /dst/images/"
            docker compose --file docker-compose.full.yml \
              --file docker-compose.prod-override.yml \
              up -d cache db mq search web-ui web-api worker scheduler
