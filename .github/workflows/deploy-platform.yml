name: Deploy platform to self-hosted server

# Deploys platform/ (InvenioRDM) to the production domain,
# open-vis-framework.duckdns.org - replaces the old Next.js apps/platform
# deploy workflow of the same name as of Migration Phase 8. See
# docs/adr/0005-adopt-inveniordm.md and docs/ROADMAP.md.
#
# Mirrors the previous deploy-platform.yml's SSH + Docker Compose
# pattern, reusing the same DEPLOY_SSH_KEY CI secret (same server, same
# purpose).
#
# Does NOT run one-time DB/index/role init (invenio db init create,
# invenio index init, invenio files location create, invenio roles
# create/access allow) - those were run once by hand over SSH during
# cutover, matching how Migration Phase 2's POC was set up. A fresh
# Postgres volume (new server, disaster recovery, etc.) needs that same
# manual step again - not automated here yet.
#
# Real finding (Migration Phase 10 redo, docs/ROADMAP.md): docker-compose.full.yml's
# `static_data` named volume is mounted over /opt/invenio/var/instance/static
# on both `web-ui` and `frontend`. Docker only auto-populates a named
# volume from image content the *first* time it's created empty - every
# `build` + `up -d` since then leaves the old volume content in place,
# shadowing whatever the fresh image now has baked into that path (a
# Dockerfile `COPY ./static/...` alone is not enough). Concretely: a
# new static image (logo, etc.) landed in the image, but never appeared
# live, because the pre-existing volume's old file listing just didn't
# include it. A manual `docker run -v vol:/dst ... cp` re-sync was tried
# first and did not actually take effect for reasons that weren't
# diagnosable without a shell on the server (the deploy job reported
# success, but live content stayed stale regardless). Fixed below by
# instead dropping the volume and letting Compose recreate it on every
# deploy, so it re-populates from the freshly-built image via Docker's
# normal (reliable, well-documented) first-mount behavior. Safe to do
# unconditionally - static_data only ever holds regenerable build
# output (webpack/collect results), never user data, unlike
# db_data/uploaded_data/search_data.

on:
  # Production follows a successful CI run for the exact main-branch commit.
  # This avoids deploying in parallel with the tests that are meant to guard it.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 89.58.55.170
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/open-vis-framework-src
            git fetch origin main
            git reset --hard "${{ github.event.workflow_run.head_sha || 'origin/main' }}"
            cd platform
            docker compose --file docker-compose.full.yml \
              --file docker-compose.prod-override.yml \
              build web-ui
            docker compose --file docker-compose.full.yml \
              --file docker-compose.prod-override.yml \
              build web-api worker scheduler
            # Update and verify the new optional mapping from the newly built
            # image while the current production containers are still serving.
            docker compose --file docker-compose.full.yml \
              --file docker-compose.prod-override.yml \
              run --rm --no-deps web-ui \
              "invenio rdm-records custom-fields init --field-name ovf:version_notes"
            FIELD_CHECK=$(docker compose --file docker-compose.full.yml \
              --file docker-compose.prod-override.yml \
              run --rm --no-deps web-ui \
              "invenio rdm-records custom-fields exists --field-name ovf:version_notes")
            echo "${FIELD_CHECK}"
            case "${FIELD_CHECK}" in
              *"Field ovf:version_notes exists"*) ;;
              *) echo "ERROR: ovf:version_notes mapping verification failed" >&2; exit 1 ;;
            esac
            # Force-recreate static_data so Docker's own (reliable,
            # well-documented) "auto-populate an empty named volume from
            # the image on first mount" behavior does the work, instead
            # of a manual copy step. A manual `docker run -v vol:/dst ...
            # cp` re-sync was tried first and did not actually take
            # effect for reasons that weren't diagnosable without a shell
            # on the server (job reported success, content stayed stale
            # regardless) - this is the more bulletproof alternative.
            # Containers using the volume must be stopped/removed before
            # it can be dropped.
            docker compose --file docker-compose.full.yml \
              --file docker-compose.prod-override.yml \
              rm -sf web-ui
            STATIC_VOLUME=$(docker volume ls \
              --filter label=com.docker.compose.project=platform \
              --filter label=com.docker.compose.volume=static_data \
              --format '{{.Name}}')
            echo "Resolved static_data volume: '${STATIC_VOLUME}'"
            if [ -z "${STATIC_VOLUME}" ] || [ "$(echo "${STATIC_VOLUME}" | wc -l)" -ne 1 ]; then
              echo "ERROR: expected exactly one static_data volume, got: '${STATIC_VOLUME}'" >&2
              exit 1
            fi
            docker volume rm "${STATIC_VOLUME}"
            docker compose --file docker-compose.full.yml \
              --file docker-compose.prod-override.yml \
              up -d cache db mq search web-ui web-api worker scheduler

      - name: Verify public record and badge routes
        run: |
          set -e
          RECORD_ID=$(curl --fail --silent --show-error --retry 12 \
            --retry-all-errors --retry-delay 5 \
            'https://open-vis-framework.duckdns.org/api/records?size=1' | \
            python -c 'import json,sys; print(json.load(sys.stdin)["hits"]["hits"][0]["id"])')
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 5 --output /dev/null \
            "https://open-vis-framework.duckdns.org/records/${RECORD_ID}"
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 5 --output /dev/null \
            "https://open-vis-framework.duckdns.org/badges/records/${RECORD_ID}.svg"
