# POC-only override for docker-compose.full.yml, used by
# .github/workflows/deploy-platform-invenio.yml to deploy to the same
# scratch subdomain set up by hand in Migration Phase 2
# (docs/ROADMAP.md, docs/adr/0005-adopt-inveniordm.md).
#
# Not meant to survive to Migration Phase 8 - real cutover needs its own
# proper environment config (matching how apps/platform uses a
# git-ignored .env file), not this hardcoded scratch-domain override.
#
# Usage: docker compose --file docker-compose.full.yml --file docker-compose.poc-override.yml up -d ...
#
# Does NOT override SECRET_KEY - still docker-services.yml's CHANGE_ME
# placeholder. Fine for a not-linked-anywhere scratch POC with no real
# user data; NOT fine to leave as-is for anything closer to real
# cutover - needs a real secret via a git-ignored env file (matching
# apps/platform's own .env pattern), not something hardcoded here.

services:
  web-ui:
    environment:
      - "INVENIO_SITE_UI_URL=https://ovf-invenio.duckdns.org"
      - "INVENIO_SITE_API_URL=https://ovf-invenio.duckdns.org/api"
      - "INVENIO_TRUSTED_HOSTS=['ovf-invenio.duckdns.org','127.0.0.1','localhost','0.0.0.0']"
  web-api:
    environment:
      - "INVENIO_SITE_UI_URL=https://ovf-invenio.duckdns.org"
      - "INVENIO_SITE_API_URL=https://ovf-invenio.duckdns.org/api"
      - "INVENIO_TRUSTED_HOSTS=['ovf-invenio.duckdns.org','127.0.0.1','localhost','0.0.0.0']"
  worker:
    environment:
      - "INVENIO_SITE_UI_URL=https://ovf-invenio.duckdns.org"
      - "INVENIO_SITE_API_URL=https://ovf-invenio.duckdns.org/api"
  scheduler:
    environment:
      - "INVENIO_SITE_UI_URL=https://ovf-invenio.duckdns.org"
      - "INVENIO_SITE_API_URL=https://ovf-invenio.duckdns.org/api"
