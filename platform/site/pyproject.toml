[project]
name = "open-vis-framework"
version = "0.1.0"
description = "Add your description here"
requires-python = ">= 3.14"

[project.entry-points."invenio_base.blueprints"]
open_vis_framework_views = "open_vis_framework.views:create_blueprint"

[project.entry-points."invenio_assets.webpack"]
open_vis_framework_theme = "open_vis_framework.webpack:theme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_vis_framework"]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = ["D401", "D403"]

[tool.pytest.ini_options]
addopts = ["--isort", "--pydocstyle", "--doctest-glob=\"*.rst\"", "--doctest-modules", "--cov=open_vis_framework", "--cov-report=term-missing", "--exclude-warning-annotations"]
testpaths = "tests open_vis_framework"
live_server_scope = "module"
