# Production override for docker-compose.full.yml - the real deploy
# target (open-vis-framework.duckdns.org), replacing the old apps/platform.
#
# KNOWN GAP, accepted deliberately: this does NOT override SECRET_KEY -
# still docker-services.yml's CHANGE_ME placeholder. Follow-up work, not
# blocking deploys.
#
# Usage: docker compose --file docker-compose.full.yml --file docker-compose.prod-override.yml up -d ...

services:
  web-ui:
    environment:
      - "INVENIO_SITE_UI_URL=https://open-vis-framework.duckdns.org"
      - "INVENIO_SITE_API_URL=https://open-vis-framework.duckdns.org/api"
      - "INVENIO_TRUSTED_HOSTS=['open-vis-framework.duckdns.org','127.0.0.1','localhost','0.0.0.0']"
  web-api:
    environment:
      - "INVENIO_SITE_UI_URL=https://open-vis-framework.duckdns.org"
      - "INVENIO_SITE_API_URL=https://open-vis-framework.duckdns.org/api"
      - "INVENIO_TRUSTED_HOSTS=['open-vis-framework.duckdns.org','127.0.0.1','localhost','0.0.0.0']"
  worker:
    environment:
      - "INVENIO_SITE_UI_URL=https://open-vis-framework.duckdns.org"
      - "INVENIO_SITE_API_URL=https://open-vis-framework.duckdns.org/api"
  scheduler:
    environment:
      - "INVENIO_SITE_UI_URL=https://open-vis-framework.duckdns.org"
      - "INVENIO_SITE_API_URL=https://open-vis-framework.duckdns.org/api"
