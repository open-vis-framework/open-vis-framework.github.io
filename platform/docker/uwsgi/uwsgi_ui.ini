[uwsgi]
# http-socket, not the uwsgi-protocol `socket` directive: Traefik talks
# plain HTTP directly to this container (no nginx `frontend` in front to
# translate uwsgi_pass -> uwsgi protocol - see docs/ROADMAP.md Migration
# Phase 2/8).
http-socket = 0.0.0.0:5000
# nginx normally serves /static (see docker/nginx/conf.d/default.conf's
# `location /static` block) - since there's no nginx in front here,
# uwsgi serves it directly instead. Without this, the deposit form's JS
# bundle 404s and the page effectively breaks (found via real user
# testing right after cutover - this isn't just cosmetic).
static-map = /static=/opt/invenio/var/instance/static
stats = 0.0.0.0:9000
module = invenio_app.wsgi_ui:application
master = true
die-on-term = true
processes = 2
threads = 2
single-interpreter = true
buffer-size = 8192
wsgi-disable-file-wrapper = true
reload-on-rss = 666
