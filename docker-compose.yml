# Single source of truth for running apps/platform, used identically for
# local development and on the production server (see
# docs/adr/0003-dockerize-same-server.md and docs/ROADMAP.md).
#
# Local dev: `docker compose up -d postgres` for infra, `pnpm dev` for the
# app itself (fast HMR). `docker compose up --build` runs the full stack
# through this same Dockerfile, for a prod-parity check before pushing.
#
# docker-compose.override.yml (dev-only, git-tracked) adds things that
# should NEVER apply on the server, like publishing Postgres's port.

services:
  platform:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/platform/.env
    environment:
      # Overrides whatever DATABASE_URL is in .env: that file is shared
      # with host-side tooling (drizzle-kit, `pnpm dev`), which needs
      # "localhost" - the containerized app needs the Docker network
      # service name instead. `environment:` wins over `env_file:` for
      # the same key.
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
      # Same reasoning: .env has a host-relative path for `pnpm dev`;
      # the container needs its actual mount point (below).
      UPLOADS_DIR: /app/apps/platform/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - platform_uploads:/app/apps/platform/uploads
    ports:
      - "3001:3000"

  # One-off: `docker compose --profile tools run --rm migrate`. Uses the
  # Dockerfile's `builder` stage, which still has drizzle-kit/devDeps
  # (the slim `platform` runtime image deliberately doesn't) - and gives
  # a way to reach postgres (Docker network name, no published port) to
  # run migrations without needing Node/pnpm installed on the host at
  # all, on any server this stack runs on.
  migrate:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
      target: builder
    profiles: ["tools"]
    env_file:
      - apps/platform/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
    working_dir: /repo/apps/platform
    entrypoint: ["pnpm", "exec", "drizzle-kit", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: `docker compose --profile tools run --rm seed`. Same
  # builder-stage trick as migrate. Creates a fixed test account
  # (admin@example.com / admin) if it doesn't already exist - see
  # apps/platform/scripts/seed.ts. Dev/test convenience only; harmless
  # to run anywhere since there's no elevated role/permission tied to it
  # (no moderation system exists yet - see docs/ROADMAP.md).
  seed:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
      target: builder
    profiles: ["tools"]
    env_file:
      - apps/platform/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
    working_dir: /repo/apps/platform
    entrypoint: ["node", "--experimental-strip-types", "scripts/seed.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in apps/platform/.env}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    env_file:
      - apps/platform/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Deliberately no `ports:` here — publishing 5432 on this file would
    # expose Postgres on the server's public IP too, since this is the
    # same file the server deploys. Host access for local tooling
    # (drizzle-kit studio etc.) comes from docker-compose.override.yml.

volumes:
  postgres_data:
  platform_uploads:
