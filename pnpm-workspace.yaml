packages:
  - apps/*
  - packages/*

# Packages that ship native build scripts. pnpm blocks these by default
# (supply-chain safety); we keep them disabled until something actually
# needs them. (apps/platform, which used sharp, was retired - see
# docs/adr/0005-adopt-inveniordm.md - but leaving these disabled by
# default is still the right posture for whatever's added next.)
allowBuilds:
  # drizzle-kit's CLI uses esbuild internally (TS config loading /
  # migration tooling); its install script just fetches a prebuilt
  # native binary for the current platform. Widely used, low risk.
  esbuild: true
  sharp: false
  unrs-resolver: false
